name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Hosted MCP (Lambda) only needs GHCR. Don't block it on npm registry auth.
  publish-ghcr:
    name: GHCR + deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Dockerfile COPY's dist/ + node_modules/ from the build context.
      - run: npm ci
      - run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build --platform linux/arm64 \
            -t ghcr.io/${OWNER}/zenrows-mcp:${{ github.ref_name }} \
            -t ghcr.io/${OWNER}/zenrows-mcp:latest \
            .
          docker push ghcr.io/${OWNER}/zenrows-mcp:${{ github.ref_name }}
          docker push ghcr.io/${OWNER}/zenrows-mcp:latest

      - name: Trigger deployment
        run: |
          gh api repos/ZenRows/zenrows-mcp-deploy/dispatches \
            --method POST \
            --input - <<EOF
          {"event_type":"deploy","client_payload":{"tag":"${{ github.ref_name }}"}}
          EOF
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_PAT }}

  publish-npm:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm >= 11.5.1 (ships with Node 24).
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # No NODE_AUTH_TOKEN — npm uses GitHub OIDC against the Trusted Publisher
      # configured on https://www.npmjs.com/package/@zenrows/mcp (Settings).
      # Provenance is automatic with trusted publishing.
      - run: npm publish --access public
